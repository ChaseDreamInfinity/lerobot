# Two USB2 UVC cameras on the AGX Orin share a single 480 Mbit/s bus: 3610000.usb
# is the only USB host controller, and USB2 devices always attach to the usb1 root
# hub, so the cameras cannot be split across buses.
#
# These cameras reserve isochronous bandwidth from their MAXIMUM endpoint payload
# rather than the actual MJPG bitrate (~15 Mbit/s each at 640x480@30). Two of them
# over-subscribe the bus, so the second to start streaming fails to allocate and
# returns zero frames; the resulting device resets can escalate to re-enumeration.
#
# UVC_QUIRK_FIX_BANDWIDTH (0x80 = 128) makes uvcvideo compute the real required
# bandwidth instead of trusting the descriptor.
#
# Install:
#   sudo cp scripts/local/uvcvideo-fix-bandwidth.conf /etc/modprobe.d/
#   sudo modprobe -r uvcvideo && sudo modprobe uvcvideo
#   cat /sys/module/uvcvideo/parameters/quirks   # expect 128
options uvcvideo quirks=128
